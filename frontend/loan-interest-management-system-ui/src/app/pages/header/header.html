<mat-toolbar class="topbar" color="transparent">
  <div class="nav-shell">
    <a class="brand" href="#" aria-label="Loan Manager home">
      <span class="brand-mark">LM</span>
      <span>Loan Manager</span>
    </a>

    <nav class="main-nav" aria-label="Main navigation">
      <ng-container *ngIf="userName();else navitems">
        <a *ngFor="let item of navItems" [routerLink]="[`/${item.key}`]">{{ item.label }}</a>

      </ng-container>
      <ng-template #navitems>

        <a *ngFor="let item of navItems" [routerLink]="[`/${item.key}`]">{{ item.label!='New Client'?item.label:'' }}</a>

      </ng-template>
    </nav>

    <button
      *ngIf="!isLoggedIn()"
      mat-flat-button
      class="signup-btn"
      type="button"
      (click)="navigateToLogin()"
    >
      Login
    </button>

    <div *ngIf="isLoggedIn()" class="user-account" [attr.title]="userName()" aria-label="Logged in user">
      <div class="user-avatar">{{ userInitial() }}</div>
    </div>
  </div>
</mat-toolbar>
