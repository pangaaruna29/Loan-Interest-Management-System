<div class="clients-container">
  <mat-card class="client-card">
    <div class="header">
      <h3>Loan & Interest Accounts</h3>
      <button mat-raised-button color="primary" (click)="addClient()">New Client</button>
    </div>

    <table mat-table [dataSource]="dataSource">
      <ng-container *ngFor="let column of columnDefs" [matColumnDef]="column.key">
        <ng-container *ngIf="column.key !== 'actions'; else actionbtns">
          <th mat-header-cell *matHeaderCellDef>{{ column.label }}</th>
          <td mat-cell *matCellDef="let data">
            <span
              *ngIf="column.key === 'paymentStatus'"
              class="status-badge"
              [ngClass]="getStatusClass(data[column.key])"
            >
              {{ data[column.key] }}
            </span>

            <span *ngIf="column.key !== 'paymentStatus'">
              {{ column.key.toLowerCase().includes('date') ? formatDate(data[column.key]) : data[column.key] }}
            </span>
          </td>
        </ng-container>

        <ng-template #actionbtns>
          <th mat-header-cell *matHeaderCellDef>{{ column.label }}</th>
          <td mat-cell *matCellDef="let data" class="icons">
            <mat-icon fontIcon="visibility" (click)="viewClient()"></mat-icon>
          </td>
        </ng-template>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="getDisplayedColumns()"></tr>
      <tr mat-row *matRowDef="let row; columns: getDisplayedColumns()"></tr>
    </table>
  </mat-card>
</div>
